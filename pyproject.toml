[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "runsignal"
version = "0.1.0"
description = "Local JUnit test history with shard reconciliation and inspectable evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
runsignal = "runsignal.__main__:main"

[tool.setuptools]
packages = ["runsignal"]

[tool.setuptools.package-data]
runsignal = ["report.html"]
