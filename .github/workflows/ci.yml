name: Verify RunSignal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved 2026-09-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7, resolved 2026-09-08
        with:
          python-version: ${{ matrix.python }}
      - name: Core tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Create synthetic reports
        run: python examples/make_demo.py
      - name: Import synthetic history
        run: python -m runsignal ingest examples/synthetic/manifest.json
      - name: Build portable CLI
        run: python tools/build_release.py
      - name: Verify packaged report generation
        run: python dist/runsignal.pyz report --out output
